# Pages CMS configuration (app.pagescms.org)
# Mirrors the Zod schema in src/content.config.ts - keep the two in sync.
# Descriptions are the help text Christine sees under each field.

# Uploads are limited to their own folders so site photos in public/images can't be overwritten.
media:
  - name: workshops
    label: Workshop images
    input: public/images/workshops
    output: /images/workshops
    categories: [image]
  # Artwork goes through Astro's image pipeline, so it lives in src/assets and the path written
  # into each entry is relative to src/content/artwork/*.md (what Astro's image() expects).
  - name: artwork
    label: Artwork images
    input: src/assets/artwork
    output: ../../assets/artwork
    extensions: [jpg, jpeg, png, webp]

content:
  - name: workshops
    label: Workshops
    type: collection
    path: src/content/workshops
    format: yaml-frontmatter
    # Workshop date, not today: {year}-{month}-{day} would be the creation date.
    filename: "{fields.date}-{primary}.md"
    view:
      primary: title
      fields: [title, date, audience, status]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The workshop name, as it appears on the website."
      - name: audience
        label: Audience
        type: select
        required: true
        description: "Kids workshops appear on the For Kids page, teen workshops in the Teen art section of that page, adult workshops on the For Adults page."
        options:
          values:
            - name: kids
              label: Kids
            - name: teens
              label: Teens
            - name: adults
              label: Adults
      - name: category
        label: Category
        type: string
        required: true
        description: "The medium, in a word or two, e.g. Painting, Clay, Printmaking"
      - name: accent
        label: Card colour
        type: select
        description: "Optional; can be left alone. The coloured dot beside the category. Leave it empty and the site picks one so neighbouring cards differ."
        options:
          values:
            - name: red
              label: Red
            - name: yellow
              label: Yellow
            - name: sage
              label: Sage green
            - name: blue
              label: Blue
            - name: plum
              label: Plum
      - name: date
        label: Date (first session)
        type: date
        required: true
        description: "The day of the workshop, or the first day of a series. It comes off the website automatically once this date has passed."
        options:
          format: yyyy-MM-dd
      - name: sessions
        label: Number of sessions
        type: number
        default: 1
        description: "1 for a single workshop, or e.g. 4 for a 4-week series."
        options:
          min: 1
      - name: startTime
        label: Start time (24-hour)
        type: string
        required: true
        description: "Use the 24-hour clock, e.g. 10:00 for 10 AM or 16:45 for 4:45 PM."
        pattern:
          regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          message: "Use 24-hour HH:MM, e.g. 16:45"
      - name: endTime
        label: End time (24-hour)
        type: string
        required: true
        description: "Use the 24-hour clock, e.g. 12:00 for noon or 18:00 for 6 PM."
        pattern:
          regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          message: "Use 24-hour HH:MM, e.g. 18:00"
      - name: ageMin
        label: Minimum age
        type: number
        required: true
        description: "Youngest age welcome. Kids and teen workshops are ages 6-16. For adult workshops, use 18."
        options:
          min: 4
          max: 18
      - name: ageMax
        label: Maximum age
        type: number
        required: true
        description: "Oldest age welcome. Kids and teen workshops are ages 6-16. For adult workshops, use 99 (the site shows Adults instead of an age range)."
        options:
          min: 4
          max: 99
      - name: blurb
        label: Short description
        type: text
        description: "Optional; can be added later. One or two sentences about what you'll make. Shown on the card."
      - name: provided
        label: What's provided
        type: text
        default: "All art supplies included"
        description: "Supplies you provide. Starts as All art supplies included; change it only if you want to be more specific."
      - name: bring
        label: What to bring
        type: text
        description: "Optional. What people should bring, e.g. A smock or old shirt. Leave it empty and the card leaves it out."
      - name: status
        label: Availability
        type: select
        default: open
        description: "Can be left alone: it starts as Spots open. What visitors see on the card. Spots open and Almost full both show an Email to register button, Waitlist shows Email to join waitlist, and Full greys out the card."
        options:
          values:
            - name: open
              label: Spots open
            - name: almost
              label: Almost full
            - name: waitlist
              label: Waitlist
            - name: full
              label: Full
      - name: special
        label: Special workshop
        type: boolean
        default: false
        description: "Can be left alone (off). Turn it on to highlight this workshop with a dark card on the homepage."

  - name: artwork
    label: Artwork
    type: collection
    path: src/content/artwork
    format: yaml-frontmatter
    # {fields.title} is slugified by Pages CMS, e.g. "Heron at Dusk" becomes heron-at-dusk.md.
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [image, title, medium]
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The name of the piece, as it appears under the picture."
      - name: medium
        label: Medium
        type: string
        required: true
        description: "e.g. Relief print, Acrylic on canvas"
      - name: year
        label: Year
        type: number
        description: "Optional. The year the piece was made, e.g. 2024. Leave it empty and no year is shown."
        options:
          min: 1970
          max: 2100
      - name: image
        label: Picture
        type: image
        required: true
        description: "A photo of the piece. Any phone photo is fine (JPG or PNG); the website resizes it. On an iPhone, choose JPG or Most Compatible if it offers a choice."
        options:
          media: artwork
          rename: true
      - name: note
        label: Note
        type: text
        description: "Optional. One or two sentences about the piece, shown under the medium."
      - name: order
        label: Position
        type: number
        description: "Optional. Leave empty to list newest first. To pin a piece near the top, give it a number: 1 comes first, then 2, and so on."
        options:
          min: 1
